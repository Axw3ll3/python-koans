name: Protect main

on:
  push:
    branches: [main]

jobs:
  revert:
    if: github.actor != 'saldestechnology'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert unauthorized push
        run: |
          git config user.name "main-protector"
          git config user.email "actions@github.com"
          git reset --hard ${{ github.event.before }}
          git push --force origin main

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `@${context.actor} — det gick inte att pusha direkt till \`main\`. Din push har återställts.\n\nSå här gör du istället:\n1. Se till att din branch heter \`fornamn-efternamn/vN-dag-N\` (t.ex. \`anna-johansson/v19-dag-1\`)\n2. Pusha till din branch: \`git push origin anna-johansson/v19-dag-1\`\n3. Öppna ett Pull Request mot \`main\` på GitHub`
            });
